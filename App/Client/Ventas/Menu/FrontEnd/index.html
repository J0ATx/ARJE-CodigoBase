<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <base href="/App/Client/Ventas/Menu/FrontEnd/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <title>Los 3 Tanos - Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <script src="../../../../Componentes/JS/headerClient.js"></script>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div class="main-container">
        <div class="page">
            <div class="left-side">
                <client-header></client-header>
            </div>
            <div class="right-side">
                <div class="form-box">
                    <div class="menu-header">
                        <h2 class="titulo">Menú</h2>
                        <button class="btn-download" id="descargar-menu">
                            <svg class="download-svg" viewBox="0 0 384 512" height="1em"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M169.4 470.6c12.5 12.5 32.8 12.5 45.3 0l160-160c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L224 370.8 224 64c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 306.7L54.6 265.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3l160 160z">
                                </path>
                            </svg>
                            <span class="download2"></span>
                        </button>
                    </div>

                    <div class="busqueda-principal">
                        <div class="barra-busqueda">
                            <input type="text" id="busqueda-texto" placeholder="Buscar productos..."
                                class="input-busqueda">
                            <button id="btn-limpiar-busqueda" class="btn-limpiar">✕</button>
                            <button id="btn-abrir-filtros" class="btn-filtros">Filtros</button>
                        </div>
                    </div>

                    <div id="menu-listado" class="menu-contenedor"></div>
                </div>
            </div>
            <client-footer></client-footer>
        </div>
    </div>


    <div id="modal-filtros" class="modal-filtros">
        <div class="modal-contenido">
            <div class="modal-header">
                <h3>Filtros de Búsqueda</h3>
                <button id="btn-cerrar-modal" class="btn-cerrar-modal">&times;</button>
            </div>

            <div class="modal-body">
                <div class="filtros-modal">
                    <div class="filtro-grupo">
                        <label for="modal-filtro-categoria">Categoría:</label>
                        <select id="modal-filtro-categoria" class="filtro-select">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>

                    <div class="filtro-grupo">
                        <label for="modal-filtro-precio">Precio máximo:</label>
                        <select id="modal-filtro-precio" class="filtro-select">
                            <option value="">Sin límite</option>
                            <option value="50">$50</option>
                            <option value="100">$100</option>
                            <option value="200">$200</option>
                            <option value="500">$500</option>
                        </select>
                    </div>

                    <div class="filtro-grupo">
                        <label for="modal-filtro-calificacion">Calificación mínima:</label>
                        <select id="modal-filtro-calificacion" class="filtro-select">
                            <option value="">Cualquier calificación</option>
                            <option value="1">1+ estrellas</option>
                            <option value="2">2+ estrellas</option>
                            <option value="3">3+ estrellas</option>
                            <option value="4">4+ estrellas</option>
                            <option value="5">5+ estrellas</option>
                        </select>
                    </div>

                    <div class="filtro-grupo">
                        <label for="modal-ordenar">Ordenar por:</label>
                        <select id="modal-ordenar" class="filtro-select">
                            <option value="nombre">Nombre</option>
                            <option value="precio-asc">Precio (menor a mayor)</option>
                            <option value="precio-desc">Precio (mayor a menor)</option>
                            <option value="calificacion">Calificación</option>
                            <option value="categoria">Categoría</option>
                        </select>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="btn-limpiar-todos-modal" class="btn-limpiar-filtros">Limpiar Filtros</button>
                    <button id="btn-aplicar-filtros" class="btn-aplicar-filtros">Aplicar Filtros</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../menu.js"></script>
    <script src="../session.js"></script>
    <script src="../../../../Componentes/JS/footerClient.js"></script>
</body>

</html>
