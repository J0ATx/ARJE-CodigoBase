<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/App/Control/Errores/">
    <title>Error 401 - No Autorizado</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <div class="error-code">401</div>
            <h1 class="error-title">No Autorizado</h1>
        </div>
        <p class="error-description">No tienes permiso para acceder a este contenido. Verifica tus credenciales e intenta nuevamente.</p>
        <div class="error-divider"></div>
        <div class="error-actions">
            <a href="/" class="error-link">Volver al Inicio</a>
            <a href="/App/Control/SignIn/FrontEnd/index.html" class="error-link error-link-secondary">Iniciar Sesión</a>
        </div>
    </div>
</body>
</html>
