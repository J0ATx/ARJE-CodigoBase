<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/App/Control/Errores/">
    <title>Error 500 - Error del Servidor</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <div class="error-code">500</div>
            <h1 class="error-title">Error del Servidor</h1>
        </div>
        <p class="error-description">Algo salió mal en nuestro servidor. Estamos trabajando para solucionarlo. Intenta nuevamente más tarde.</p>
        <div class="error-divider"></div>
        <div class="error-actions">
            <a href="/" class="error-link">Volver al Inicio</a>
            <a href="javascript:location.reload()" class="error-link error-link-secondary">Reintentar</a>
        </div>
    </div>
</body>
</html>
