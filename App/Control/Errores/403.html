<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/App/Control/Errores/">
    <title>Error 403 - Acceso Prohibido</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="error-container">
        <div class="error-header">
            <div class="error-code">403</div>
            <h1 class="error-title">Acceso Prohibido</h1>
        </div>
        <p class="error-description">No tienes permiso para acceder a este recurso. Si crees que es un error, contacta al administrador.</p>
        <div class="error-divider"></div>
        <div class="error-actions">
            <a href="/" class="error-link">Volver al Inicio</a>
            <a href="/App/Client/Contacto/Frontend/index.html" class="error-link error-link-secondary">Contactar Soporte</a>
        </div>
    </div>
</body>
</html>
