<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/ARJE-CodigoBase/App/Componentes/JS/navAdmin.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/ARJE-CodigoBase/App/Recursos/favicon.ico">
    <title>Los 3 Tanos - Gestión de Productos</title>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <h1>GESTIÓN DE PRODUCTOS</h1>
                <div class="products-table">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
                                        fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <button id="addProductBtn" class="action-button">+ Agregar Producto</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>NOMBRE</th>
                                <th>PRECIO</th>
                                <th>CALIFICACIÓN</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para productos -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Agregar Producto</h2>
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="nombre">Nombre del Producto</label>
                        <input type="text" id="nombre" required>
                    </div>

                    <div class="form-group">
                        <label for="precio">Precio</label>
                        <input type="number" id="precio" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="categoria">Categoría</label>
                        <input type="text" id="categoria" list="categoryList" placeholder="Ej: Pastas, Pizzas, Postres">
                        <datalist id="categoryList"></datalist>
                    </div>

                    <div class="form-group">
                        <label for="tiempo_preparacion">Tiempo de preparación</label>
                        <input type="text" id="tiempo_preparacion" placeholder="Ej: 15 min">
                    </div>

                    <div class="form-group">
                        <label>Ingredientes</label>
                        <p class="info-text" style="font-size: 0.85em; color: #666; margin-bottom: 8px;">
                            El sistema consume automáticamente los lotes más próximos a caducar.
                        </p>
                        <div class="ingredient-selector">
                            <select id="ingredientSelect">
                            </select>
                            <input type="number" id="ingredientAmount" placeholder="Cantidad" min="0" step="0.01">
                            <button type="button" class="add-ingredient-btn">Añadir</button>
                        </div>
                        <div id="ingredientsList">

                        </div>
                    </div>

                    <div class="form-group">
                        <label for="productImage">Imagen del Producto</label>
                        <input type="file" id="productImage" accept="image/jpeg, image/png, image/jpg" style="margin-bottom: 15px;">
                        <p class="info-text" style="font-size: 0.85em; color: #666; margin-top: -10px; margin-bottom: 15px;">
                            Formatos aceptados: JPG, PNG. Tamaño máximo: 2MB
                        </p>

                    <div class="form-group">
                        <label for="receta">Receta (texto multilinea)</label>
                        <textarea id="receta" rows="6" placeholder="Describe la receta, un paso por línea..."></textarea>
                    </div>

                    <button type="submit" class="submit-button">Guardar Producto</button>
            </form>
        </div>
    </div>

    <div id="ingredientModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Agregar Ingrediente</h2>
                <form id="ingredientForm">
                    <div class="form-group">
                        <label for="ingredientName">Nombre del Ingrediente</label>
                        <input type="text" id="ingredientName" required>
                    </div>
                    <div class="form-group">
                        <label for="ingredientStock">Cantidad</label>
                        <input type="number" id="ingredientStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="ingredientMeasure">Unidad de Medida</label>
                        <select id="ingredientMeasure" required>
                            <option value="g">Gramos (g)</option>
                            <option value="kg">Kilogramos (kg)</option>
                            <option value="ml">Mililitros (ml)</option>
                            <option value="L">Litros (L)</option>
                            <option value="u">Unidades (u)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ingredientExpiry">Fecha de Caducidad</label>
                        <input type="date" id="ingredientExpiry" required>
                    </div>
                <button type="submit" class="submit-button">Guardar Ingrediente</button>
            </form>
        </div>
    </div>
    <script src="../session.js"></script>
    <script src="../script.js"></script>
</body>

</html>
