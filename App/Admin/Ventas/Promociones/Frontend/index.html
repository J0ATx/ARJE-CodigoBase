<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <base href="/App/Admin/Ventas/Promociones/Frontend/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Promociones</title>
    <script src="/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/App/Recursos/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#1c1c1c">
    <meta name="description" content="Gestión de promociones">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <h1>GESTIÓN DE PROMOCIONES</h1>
                <div class="tabla-contenedor">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z" fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <button id="btnCrearPromocion" class="action-button">+ Agregar Promoción</button>
                    </div>
                    <table id="promocionesTable">
                        <thead>
                            <tr>
                                <th>NOMBRE</th>
                                <th>DESCRIPCIÓN</th>
                                <th>DESCUENTO</th>
                                <th>FIDELIZADA</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tablaPromociones"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div id="modalCrear" class="modal">
        <div class="modal-content">
            <span class="close" id="closeCrear">&times;</span>
            <h2>Agregar Promoción</h2>
            <form id="formCrearPromocion">
                <div class="form-group">
                    <label for="crear_nombre">Nombre</label>
                    <input id="crear_nombre" name="promocion_nombre" type="text" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="crear_descripcion">Descripción</label>
                    <input id="crear_descripcion" name="promocion_descripcion" type="text" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="crear_descuento">Descuento (%)</label>
                    <input id="crear_descuento" name="promocion_descuento" type="number" min="0" max="100" step="0.01" required>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="crear_fidelizada" name="promocion_fidelizada"> Promoción fidelizada</label>
                </div>
                <div class="form-group" style="max-height:240px; overflow:auto; border:1px solid #eee; padding:10px;">
                    <label>Productos (seleccione al menos 1)</label>
                    <div id="listaProductosCrear"></div>
                </div>
                <button type="submit" class="submit-button">Crear Promoción</button>
            </form>
        </div>
    </div>

    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close" id="closeEditar">&times;</span>
            <h2>Editar Promoción</h2>
            <form id="formEditarPromocion">
                <input type="hidden" id="editar_id" name="promocion_id">
                <div class="form-group">
                    <label for="editar_nombre">Nombre</label>
                    <input id="editar_nombre" name="promocion_nombre" type="text" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="editar_descripcion">Descripción</label>
                    <input id="editar_descripcion" name="promocion_descripcion" type="text" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="editar_descuento">Descuento (%)</label>
                    <input id="editar_descuento" name="promocion_descuento" type="number" min="0" max="100" step="0.01" required>
                </div>
                <div class="form-group">
                    <label><input type="checkbox" id="editar_fidelizada" name="promocion_fidelizada"> Promoción fidelizada</label>
                </div>
                <div class="form-group" style="max-height:240px; overflow:auto; border:1px solid #eee; padding:10px;">
                    <label>Productos (seleccione al menos 1)</label>
                    <div id="listaProductosEditar"></div>
                </div>
                <button type="submit" class="submit-button">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <div id="modalNotificacion" class="modal modal-notification">
        <div class="modal-content notification-content">
            <div class="notification-icon" id="notificationIcon"></div>
            <h2 id="notificationTitle">Título</h2>
            <p id="notificationMessage">Mensaje</p>
            <button type="button" class="submit-button" id="btnModalNotificacionAceptar">Aceptar</button>
        </div>
    </div>

    <div id="modalConfirmacion" class="modal modal-notification">
        <div class="modal-content notification-content">
            <div class="notification-icon warning">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                </svg>
            </div>
            <h2 id="confirmacionTitle">Confirmar acción</h2>
            <p id="confirmacionMessage">¿Estás seguro?</p>
            <div class="form-buttons">
                <button type="button" class="cancel-button" id="btnCancelarConfirmacion">Cancelar</button>
                <button type="button" class="submit-button" id="btnConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../session.js"></script>
    <script src="../script.js"></script>
</body>
</html>
