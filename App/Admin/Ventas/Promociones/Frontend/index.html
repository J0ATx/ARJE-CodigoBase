<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <base href="/App/Admin/Ventas/Promociones/Frontend/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Promociones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        h2 {
            color: #34495e;
            margin: 30px 0 20px 0;
            border-bottom: 3px solid #007bff;
            padding-bottom: 10px;
            font-size: 1.8em;
        }
        
        /* Mensajes de alerta */
        .alert {
            padding: 15px 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease-in-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .close-alert {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: inherit;
            padding: 0;
        }
        
        .close-alert:hover {
            opacity: 0.7;
        }
        
        #mensajeError {
            display: none;
        }
        
        /* Indicador de carga */
        #cargandoIndicador {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Botones */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
            box-shadow: 0 4px 8px rgba(0, 91, 179, 0.3);
        }
        
        .btn-editar {
            background-color: #28a745;
            color: white;
            padding: 8px 16px;
            font-size: 0.85em;
        }
        
        .btn-editar:hover {
            background-color: #218838;
        }
        
        .btn-eliminar {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            font-size: 0.85em;
        }
        
        .btn-eliminar:hover {
            background-color: #c82333;
        }
        
        /* Grid de productos */
        .productos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .producto-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .producto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        .producto-card h3 {
            color: #007bff;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .producto-card p {
            margin: 10px 0;
            color: #555;
            line-height: 1.6;
        }
        
        .producto-card strong {
            color: #333;
        }
        
        /* Tabla de promociones */
        .promociones-tabla {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
            margin-bottom: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        table thead {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            color: white;
        }
        
        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }
        
        table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }
        
        table tbody tr {
            transition: background-color 0.3s ease;
        }
        
        table tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .acciones {
            display: flex;
            gap: 8px;
        }
        
        .acciones button {
            margin: 0;
        }
        
        /* Sin datos */
        .no-data {
            background: white;
            padding: 40px;
            text-align: center;
            border-radius: 8px;
            color: #999;
            margin: 20px 0;
        }
        
        .no-data p {
            font-size: 1.1em;
        }
        
        /* Header de página */
        .header-acciones {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            h2 {
                font-size: 1.4em;
            }
            
            .productos-grid {
                grid-template-columns: 1fr;
            }
            
            table {
                font-size: 0.85em;
            }
            
            table th, table td {
                padding: 10px;
            }
            
            .acciones {
                flex-direction: column;
            }
            
            .acciones button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Gestión de Promociones</h1>
        
        <div id="mensajeError"></div>
        
        <div id="cargandoIndicador">
            <div class="spinner"></div>
            <p>Cargando datos...</p>
        </div>
        
        <div id="productosContainer"></div>
        <div id="promocionesContainer"></div>
    </div>
    
    <script src="../script.js"></script>
</body>
</html>
