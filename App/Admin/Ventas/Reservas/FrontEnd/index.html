<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Reservas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <link rel="stylesheet" href="style.css" />
    <script src="/ARJE-CodigoBase/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>

    <div id="main-content">
        <div class="page">
            <nav-Admin></nav-Admin>
            <main class="contenedor">
                <h1>GESTIÓN DE RESERVAS</h1>
                <div class="tabla-contenedor">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar por email" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
                                        fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <div class="filtro">
                            <span class="icono-filtro">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M18.3332 2.5H1.6665L8.33317 10.3833V15.8333L11.6665 17.5V10.3833L18.3332 2.5Z"
                                        stroke="#A4A4A4" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg>
                            </span>
                            <span>Filtrar</span>
                            <div class="dropdown-filtro">
                                <div class="dropdown-content">
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="orden" value="usuario" class="filter-checkbox">
                                        <span class="checkmark"></span>
                                        Usuario
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="orden" value="mesa" class="filter-checkbox">
                                        <span class="checkmark"></span>
                                        Mesa
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="orden" value="fecha" class="filter-checkbox">
                                        <span class="checkmark"></span>
                                        Fecha
                                    </label>
                                    <label class="checkbox-item">
                                        <input type="checkbox" name="orden" value="cantidad_personas" class="filter-checkbox">
                                        <span class="checkmark"></span>
                                        Cantidad de Personas
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <table id="reservasTable">
                        <thead class="thead-personalizado">
                            <tr>
                                <th>USUARIO</th>
                                <th>MESA</th>
                                <th>FECHA</th>
                                <th>CANT-PERSONAS</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para editar reserva -->
    <div id="modalEditarReserva" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalEditarReserva()">&times;</span>
            <h2>Editar Reserva</h2>
            <form id="formEditarReserva">
                <input type="hidden" id="edit_idReserva" name="idReserva">
                <div class="form-group">
                    <label for="edit_reserva_cantidad_personas">Cantidad de Personas:</label>
                    <input type="number" id="edit_reserva_cantidad_personas" name="reserva_cantidad_personas" required>
                </div>
                <div class="form-group">
                    <label for="edit_reserva_duracion">Duración (horas):</label>
                    <select id="edit_reserva_duracion" name="reserva_duracion" required>
                        <option value="1">1 hora</option>
                        <option value="2">2 horas</option>
                        <option value="3">3 horas</option>
                        <option value="4">4 horas</option>
                        <option value="5">5 horas</option>
                        <option value="6">6 horas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit_reserva_fecha">Fecha:</label>
                    <input type="date" id="edit_reserva_fecha" name="reserva_fecha" required>
                </div>
                <div class="form-group">
                    <label for="edit_reserva_inicio">Hora de Inicio:</label>
                    <input type="time" id="edit_reserva_inicio" name="reserva_inicio" required>
                </div>
                <div class="form-group">
                    <label for="edit_cliente_id">Cliente Email:</label>
                    <input type="text" id="edit_cliente_id" name="cliente_id" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label for="edit_mesa_id">Mesa ID:</label>
                    <input type="number" id="edit_mesa_id" name="mesa_id">
                </div>
                <div class="form-buttons">
                    <button type="submit" class="submit-button">Guardar Cambios</button>
                    <button type="button" class="cancel-button" onclick="cerrarModalEditarReserva()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../session.js"></script>
    <script src="../control.js"></script>
    <script src="script.js"></script>
</body>

</html>
