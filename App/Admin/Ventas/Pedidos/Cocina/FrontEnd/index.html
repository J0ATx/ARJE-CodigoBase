<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <base href="/App/Admin/Ventas/Pedidos/Cocina/FrontEnd/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Cocina</title>
  <link rel="stylesheet" href="style.css">
  <script src="/App/Componentes/JS/navAdmin.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/App/Recursos/favicon.ico">
</head>

<body>
  <div id="loading-screen">
    <div id="logo-container" class="logo-loading"></div>
  </div>

  <div id="main-content">
    <div class="page">
      <nav-Admin></nav-Admin>
      <main class="contenedor">
        <h1>PEDIDOS - COCINA</h1>
        <div class="kds-container">
          <div class="kds-header">
            <div class="kds-controls">
              <label class="toggle-container">
                <input type="checkbox" id="togglePagados">
                <span class="toggle-slider"></span>
                <span class="toggle-label">Mostrar pedidos pagados</span>
              </label>
            </div>
          </div>
          <div class="kds-body">
            <div id="pedidosList" class="pedidos-grid">
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="modalNotificacion" class="modal modal-notification">
    <div class="modal-content notification-content">
      <div class="notification-icon" id="notificationIcon"></div>
      <h2 id="notificationTitle">Título</h2>
      <p id="notificationMessage">Mensaje</p>
      <button type="button" class="submit-button" onclick="cerrarModalNotificacion()">Aceptar</button>
    </div>
  </div>

  <div id="modalConfirmacion" class="modal modal-notification">
    <div class="modal-content notification-content">
      <div class="notification-icon warning">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
        </svg>
      </div>
      <h2 id="confirmacionTitle">Confirmar acción</h2>
      <p id="confirmacionMessage">¿Estás seguro?</p>
      <div class="form-buttons">
        <button type="button" class="cancel-button" onclick="cancelarConfirmacion()">Cancelar</button>
        <button type="button" class="submit-button" id="btnConfirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="../session.js"></script>
  <script src="../script.js"></script>
</body>

</html>
