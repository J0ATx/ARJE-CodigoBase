<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <base href="/App/Admin/Mesas/FrontEnd/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Mesas</title>
    <script src="/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/App/Recursos/favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <h1>GESTIÓN DE MESAS</h1>
                <div class="tabla-contenedor">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
                                        fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <button id="addMesaBtn" class="action-button">+ Agregar Mesa</button>
                    </div>
                    <table id="mesasTable">
                        <thead>
                            <tr>
                                <th>ID MESA</th>
                                <th>CAPACIDAD</th>
                                <th>ESTADO ACTUAL</th>
                                <th>RESERVABLE</th>
                                <th>TIEMPO DE USO</th>
                                <th>RESERVAS</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMesas"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    <div id="modalEditar">
        <form>
            <h2>Editar Mesa</h2>
            <input id="edit_idMesa" type="hidden">
            <input id="edit_capacidad" placeholder="Capacidad" type="number" min="1" required>
            <select id="edit_estadoActual">
                <option value="Libre">Libre</option>
                <option value="Ocupada">Ocupada</option>
                <option value="Inhabilitada">Inhabilitada</option>
            </select>
            <select id="edit_reservable">
                <option value="Si">Sí</option>
                <option value="No">No</option>
            </select>
            <input type="submit" value="Guardar cambios" onclick="guardarCambiosMesa()">
            <button type="button" onclick="cerrarModalEditar()">Cancelar</button>
        </form>
    </div>

    <div id="modalCrear" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalCrear()">&times;</span>
            <h2>Agregar Mesa</h2>
            <form id="formMesa">
                <div class="form-group">
                    <label for="capacidad">Capacidad</label>
                    <input id="capacidad" type="number" min="1" required>
                </div>
                <div class="form-group">
                    <label for="estadoActual">Estado Actual</label>
                    <select id="estadoActual">
                        <option value="Libre">Libre</option>
                        <option value="Ocupada">Ocupada</option>
                        <option value="Inhabilitada">Inhabilitada</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="reservable">Reservable</label>
                    <select id="reservable">
                        <option value="Si" selected>Sí</option>
                        <option value="No">No</option>
                    </select>
                </div>
                <button type="submit" class="submit-button">Crear Mesa</button>
            </form>
        </div>
    </div>
    
</body>
<script src="../session.js"></script>
<script src="../control.js"></script>
</html>
