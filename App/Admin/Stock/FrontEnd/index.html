<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <base href="/App/Admin/Stock/FrontEnd/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/App/Componentes/JS/navAdmin.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/App/Recursos/favicon.ico">
    <title>Los 3 Tanos - Gestión de Inventario</title>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <h1>GESTIÓN DE INVENTARIO</h1>
                <div class="inventory-table">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
                                        fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <div class="header-actions">
                            <button id="verAlertasBtn" class="action-button alertas-btn">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z" fill="currentColor"/>
                                </svg>
                                Ver Alertas
                            </button>
                            <button id="addIngredientBtn" class="action-button">+ Agregar Lote</button>
                        </div>
                    </div>
                    <table>
                        <thead class="thead-personalizado">
                            <tr>
                                <th>NOMBRE</th>
                                <th>STOCK</th>
                                <th>CANTIDAD MÍNIMA</th>
                                <th>FECHA DE CADUCIDAD</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="ingredientsTableBody">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal" id="ingredientModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Agregar Lote</h2>
            <form id="ingredientForm">
                <input type="hidden" id="ingredientId">
                <div class="form-group">
                    <label for="nombre">Nombre del Ingrediente</label>
                    <input type="text" id="nombre" list="ingredientesExistentes" autocomplete="off" required>
                    <datalist id="ingredientesExistentes"></datalist>
                    <small>Escribe para autocompletar con ingredientes existentes</small>
                </div>
                <div class="form-group">
                    <label for="stock">Cantidad</label>
                    <input type="number" id="stock" step="any" min="0" required>
                </div>
                <div class="form-group">
                    <label for="medida">Unidad de Medida</label>
                    <select id="medida" required>
                        <option value="">Seleccione una medida</option>
                        <option value="g">Gramos (g)</option>
                        <option value="kg">Kilogramos (kg)</option>
                        <option value="ml">Mililitros (ml)</option>
                        <option value="L">Litros (L)</option>
                        <option value="u">Unidades (u)</option>
                    </select>
                    <small id="medidaInfo">
                        <span id="medidaInfoText"></span>
                    </small>
                </div>
                <div class="form-group">
                    <label for="cantidadMinima">Cantidad Mínima de Alerta</label>
                    <input type="number" id="cantidadMinima" step="any" min="0" placeholder="0">
                    <small class="cantidad-minima-info">
                        Cantidad mínima para recibir alertas de stock bajo (opcional, por defecto 0)
                    </small>
                </div>
                <div class="form-group">
                    <label for="caducidad">Fecha de Caducidad</label>
                    <input type="date" id="caducidad" required>
                </div>
                <div class="form-buttons">
                    <button type="button" class="cancel-button">Cancelar</button>
                    <button type="submit" class="submit-button">Guardar Lote</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalNotificacion" class="modal modal-notification">
        <div class="modal-content notification-content">
            <div class="notification-icon" id="notificationIcon"></div>
            <h2 id="notificationTitle">Título</h2>
            <p id="notificationMessage">Mensaje</p>
            <button type="button" class="submit-button" onclick="cerrarModalNotificacion()">Aceptar</button>
        </div>
    </div>

    <div id="modalConfirmacion" class="modal modal-notification">
        <div class="modal-content notification-content">
            <div class="notification-icon warning">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
                </svg>
            </div>
            <h2 id="confirmacionTitle">Confirmar acción</h2>
            <p id="confirmacionMessage">¿Estás seguro?</p>
            <div class="form-buttons">
                <button type="button" class="cancel-button" onclick="cancelarConfirmacion()">Cancelar</button>
                <button type="button" class="submit-button" id="btnConfirmar">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="../session.js"></script>
    <script src="../script.js"></script>
    <script src="alertas.js"></script>
</body>

</html>
