<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/ARJE-CodigoBase/App/Recursos/favicon.ico">
    <script src="/ARJE-CodigoBase/App/Componentes/JS/navAdmin.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Los 3 Tanos - Panel de Administración</title>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <nav-admin></nav-admin>

    <div id="main-content">
        <h1>Panel de Administración</h1>
        <main class="container">
            <div class="section-1">

                <section>
                    <span class="card-title" id="favicon-title">Cambiar Favicon</span>
                    <div id="favicon_img"></div>
                    <div class="download">
                        <a href="../../../../Recursos/favicon.ico" id="descargar_favicon" download="Favicon">
                            <svg id='Download_24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'
                                style='fill: currentColor; cursor: pointer;'>
                                <path
                                    d="M 11 2 C 10.448 2 10 2.448 10 3 L 10 11 L 6 11 L 12 17 L 18 11 L 14 11 L 14 3 C 14 2.448 13.552 2 13 2 L 11 2 z M 2 20 L 2 22 L 22 22 L 22 20 L 2 20 z" />
                            </svg>
                        </a>
                    </div>
                    <form>
                        <input type="file" name="archivo" id="favicon" required>
                        <input type="button" value="Subir" id="subir_favicon">
                    </form>

                </section>


                <section>
                    <span class="card-title" id="logo-title">Cambiar Logo</span>
                    <div id="logo_img"></div>
                    <div class="download">
                        <a href="../../../Recursos/logo.svg" id="descargar_logo" download="Logo">
                            <svg id='Download_24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'
                                style='fill: currentColor; cursor: pointer;'>
                                <path
                                    d="M 11 2 C 10.448 2 10 2.448 10 3 L 10 11 L 6 11 L 12 17 L 18 11 L 14 11 L 14 3 C 14 2.448 13.552 2 13 2 L 11 2 z M 2 20 L 2 22 L 22 22 L 22 20 L 2 20 z" />
                            </svg>
                        </a>
                    </div>
                    <form>
                        <input type="file" name="archivo" id="logo" required>
                        <input type="button" value="Subir" id="subir_logo">
                    </form>
                    <form>
                        <input type="text" name="nombre" id="nombre" placeholder="Nombre actual de la empresa">
                        <input type="button" value="Cambiar Nombre" id="cambiar_nombre">
                    </form>
                    <form>
                        <input type="text" name="mision" id="mision" placeholder="Misión actual de la empresa">
                        <input type="button" value="Cambiar Misión" id="cambiar_mision">
                    </form>
                    <form>
                        <input type="text" name="vision" id="vision" placeholder="Visión actual de la empresa">
                        <input type="button" value="Cambiar Visión" id="cambiar_vision">
                    </form>
                    <form>
                        <input type="text" name="whatsapp" id="facebook">
                        <input type="button" value="Cambiar Whatsapp" id="cambiar_whatsapp">
                    </form>
                    <form>
                        <input type="text" name="instagram" id="instagram">
                        <input type="button" value="Cambiar Instagram" id="cambiar_instagram">
                    </form>
                    <form>
                        <input type="text" name="facebook" id="facebook">
                        <input type="button" value="Cambiar Facebook" id="cambiar_facebook">
                    </form>
                    <form>
                        <input type="text" name="email" id="email">
                        <input type="button" value="Cambiar Email" id="cambiar_email">
                    </form>
                    <form>
                        <input type="text" name="ubicacion" id="ubicacion">
                        <input type="button" value="Cambiar Ubicación" id="cambiar_ubicacion">
                    </form>
                    <form>
                        <input type="text" name="horario" id="horario">
                        <input type="button" value="Cambiar Horario" id="cambiar_horario">
                    </form>
                    <form>
                        <input type="tel" name="tel" id="tel">
                        <input type="button" value="Añadir Telefono" id="agregar_telefono">
                    </form>
                    <form>
                        <input type="tel" name="tel" id="tel">
                        <input type="button" value="Quitar Telefono" id="agregar_telefono">
                    </form>
                    <form>
                        <input type="text" name="valor" id="valor">
                        <input type="button" value="Añadir Valor" id="agregar_valor">
                    </form>
                    <form>
                        <input type="text" name="valor" id="valor">
                    </form>
                </section>
            </div>
        </main>
    </div>
    <script src="../session.js"></script>
    <script src="../control.js"></script>
</body>

</html>
