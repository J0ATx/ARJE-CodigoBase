<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <base href="/App/Admin/Gerente/Usuarios/Frontend/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <script src="/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/App/Recursos/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <title>Gestión Usuarios</title>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <h1>GESTIÓN DE USUARIOS</h1>
                <div class="tabla-contenedor">
                    <div class="encabezado-tabla">
                        <div class="buscador-con-icono">
                            <input type="text" placeholder="Buscar" id="searchInput" class="buscador" />
                            <span class="icono-lupa">
                                <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M16.6 18L10.3 11.7C9.8 12.1 9.225 12.4167 8.575 12.65C7.925 12.8833 7.23333 13 6.5 13C4.68333 13 3.14583 12.3708 1.8875 11.1125C0.629167 9.85417 0 8.31667 0 6.5C0 4.68333 0.629167 3.14583 1.8875 1.8875C3.14583 0.629167 4.68333 0 6.5 0C8.31667 0 9.85417 0.629167 11.1125 1.8875C12.3708 3.14583 13 4.68333 13 6.5C13 7.23333 12.8833 7.925 12.65 8.575C12.4167 9.225 12.1 9.8 11.7 10.3L18 16.6L16.6 18ZM6.5 11C7.75 11 8.8125 10.5625 9.6875 9.6875C10.5625 8.8125 11 7.75 11 6.5C11 5.25 10.5625 4.1875 9.6875 3.3125C8.8125 2.4375 7.75 2 6.5 2C5.25 2 4.1875 2.4375 3.3125 3.3125C2.4375 4.1875 2 5.25 2 6.5C2 7.75 2.4375 8.8125 3.3125 9.6875C4.1875 10.5625 5.25 11 6.5 11Z"
                                        fill="#A4A4A4" />
                                </svg>
                            </span>
                        </div>
                        <button id="addUserBtn" class="action-button">+ Agregar Usuario</button>
                    </div>
                    <table id="usuariosTable">
                        <thead>
                            <tr>
                                <th>CORREO</th>
                                <th>NOMBRE</th>
                                <th>APELLIDO</th>
                                <th>TELÉFONO</th>
                                <th>TIPO</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>
    
    <div id="modalEditar">
        <form id="formEditar">
            <h2>Editar Usuario</h2>
            <input id="edit_email" type="email" placeholder="Correo" required readonly>
            <input id="edit_nombre" placeholder="Nombre" type="text" required>
            <input id="edit_apellido" placeholder="Apellido" type="text" required>
            <input id="edit_telefono" placeholder="Teléfono" type="tel" maxlength="9" pattern="\d{1,9}">
            <select id="edit_tipoUsuario">
                <option value="Cliente">Cliente</option>
                <option value="Gerente-General">Gerente General</option>
                <option value="Gerente-Turno">Gerente de Turno</option>
                <option value="Chef-Ejecutivo">Chef Ejecutivo</option>
                <option value="Chef">Chef</option>
                <option value="Camarero">Camarero</option>
            </select>
            <button type="submit">Guardar cambios</button>
            <button type="button" onclick="cerrarModalEditar()">Cancelar</button>
        </form>
    </div>

    <div id="modalCrear" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalCrear()">&times;</span>
            <h2>Agregar Usuario</h2>
            <form id="formUsuario">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" required>
                </div>
                <div class="form-group">
                    <label for="apellido">Apellido</label>
                    <input id="apellido" type="text" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input id="email" type="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono</label>
                    <input id="telefono" type="tel" maxlength="9" pattern="\d{1,9}">
                </div>
                <div class="form-group">
                    <label for="contrasenia">Contraseña</label>
                    <input id="contrasenia" type="password" required>
                </div>
                <div class="form-group">
                    <label for="tipoUsuario">Tipo de Usuario</label>
                    <select id="tipoUsuario">
                        <option value="Cliente">Cliente</option>
                        <option value="Gerente-General">Gerente General</option>
                        <option value="Gerente-Turno">Gerente de Turno</option>
                        <option value="Chef-Ejecutivo">Chef Ejecutivo</option>
                        <option value="Chef">Chef</option>
                        <option value="Camarero">Camarero</option>
                    </select>
                </div>
                <button type="submit" class="submit-button">Crear Usuario</button>
            </form>
        </div>
    </div>

    <script src="../session.js"></script>
    <script src="../control.js"></script>
</body>

</html>
