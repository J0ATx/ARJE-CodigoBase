<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <script src="/ARJE-CodigoBase/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="/ARJE-CodigoBase/App/Recursos/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <title>Gestión Usuarios</title>
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <nav-admin></nav-admin>
    <div id="main-content">
        <div id="content">
            <h1>Gestión de Usuarios</h1>
        </div>
        <main class="contenedor">
            <form id="formUsuario">
                <div class="form-container">
                    <input id="nombre" placeholder="Nombre" type="text" required>
                    <input id="apellido" placeholder="Apellido" type="text" required>
                    <input id="email" placeholder="Correo" type="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$">
                    <input id="telefono" placeholder="Teléfono" type="tel" maxlength="9" pattern="\d{1,9}">
                    <input id="contrasenia" placeholder="Contraseña" type="password" required>
                    <select id="tipoUsuario">
                        <option value="Cliente">Cliente</option>
                        <option value="Gerente-General">Gerente General</option>
                        <option value="Gerente-Turno">Gerente de Turno</option>
                        <option value="Chef-Ejecutivo">Chef Ejecutivo</option>
                        <option value="Chef">Chef</option>
                        <option value="Camarero">Camarero</option>
                    </select>
                    <button id="btnCrear" type="submit">Crear Usuario</button>
                </div>
            </form>
            <div class="tabla-contenedor">
                <table id="usuariosTable">
                    <thead>
                        <tr>
                            <th>Correo</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Teléfono</th>
                            <th>Tipo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaUsuarios"></tbody>
                </table>
            </div>
        </main>
    </div>
    <div id="modalEditar"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); justify-content:center; align-items:center;">
        <form id="formEditar" style="background:#fff; padding:20px; border-radius:8px; min-width:300px;">
            <h2>Editar Usuario</h2>
            <input id="edit_email" type="email" placeholder="Correo" required readonly>
            <input id="edit_nombre" placeholder="Nombre" type="text" required>
            <input id="edit_apellido" placeholder="Apellido" type="text" required>
            <input id="edit_telefono" placeholder="Teléfono" type="tel" maxlength="9" pattern="\d{1,9}">
            <select id="edit_tipoUsuario">
                <option value="Cliente">Cliente</option>
                <option value="Gerente-General">Gerente General</option>
                <option value="Gerente-Turno">Gerente de Turno</option>
                <option value="Chef-Ejecutivo">Chef Ejecutivo</option>
                <option value="Chef">Chef</option>
                <option value="Camarero">Camarero</option>
            </select>
            <button type="submit">Guardar cambios</button>
            <button type="button" onclick="cerrarModalEditar()">Cancelar</button>
        </form>
    </div>
    <script src="../session.js"></script>
    <script src="../control.js"></script>
</body>

</html>
