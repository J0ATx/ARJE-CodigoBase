<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Los 3 Tanos</title>
    <script src="/ARJE-CodigoBase/App/Componentes/JS/navAdmin.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav-admin></nav-admin>

    <div id="main-content">
        <div class="container">
            <h1>Estadísticas e Informes</h1>

            <div class="form-group">
                <div class="form-row">
                    <div class="form-group">
                        <label for="fechaInicio">Fecha de inicio:</label>
                        <input type="date" id="fechaInicio" required>
                    </div>
                    <div class="form-group">
                        <label for="fechaFin">Fecha de fin:</label>
                        <input type="date" id="fechaFin" required>
                    </div>
                </div>
                <button id="generarInforme">Generar Informe</button>
            </div>

            <div id="previsualizar">
                <p>Aquí aparecerá la previsualización de su archivo</p>
                <div id="doc"></div>
            </div>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
