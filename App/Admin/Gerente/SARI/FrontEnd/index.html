<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/App/Admin/Gerente/SARI/FrontEnd/">
    <title>SARI - Admin</title>
    <script src="/App/Componentes/JS/navAdmin.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="icon" type="image/png" sizes="32x32" href="../../../../Recursos/favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="loading-screen">
        <div id="logo-container" class="logo-loading"></div>
    </div>
    <div id="main-content">
        <div class="page">
            <nav-admin></nav-admin>
            <main class="contenedor">
                <section class="card">
                    <div class="chat-header">
                        <h2>Chat con SARI</h2>
                        <span class="pdf-status" id="pdfStatus">Sin PDF</span>
                    </div>
                    <div class="chat-messages" id="chatMessages"></div>
                    <div id="loading" class="loading">Generando respuesta...</div>
                    <div class="chat-inputs">
                        <button class="icon-button" id="openPdfModal" aria-label="Adjuntar PDF">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M7 3h6l5 5v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke="#363636" stroke-width="2" fill="#e8f4fd"/>
                                <path d="M13 3v5h5" stroke="#363636" stroke-width="2"/>
                            </svg>
                        </button>
                        <input type="text" id="userInput" class="input-text" placeholder="Escribe tu mensaje...">
                        <button class="submit-button" id="sendBtn">Enviar</button>
                    </div>
                </section>

                <div id="pdfModal" class="modal">
                    <div class="modal-content">
                        <span class="close" id="closePdfModal">×</span>
                        <h2>Subir PDF</h2>
                        <div class="pdf-actions">
                            <input type="file" id="pdf-file-input" accept="application/pdf">
                            <button class="submit-button" id="extractPdfBtn">Extraer texto</button>
                        </div>
                        <pre id="output" class="pdf-output"></pre>
                        <div class="form-buttons">
                            <button class="submit-button" id="useContextBtn">Usar como contexto</button>
                            <button class="cancel-button" id="clearContextBtn">Limpiar</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="../session.js"></script>
    <script type="module" src="sari.js"></script>
</body>

</html>
