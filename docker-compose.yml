version: '3.8'

services:
  app:
    build:
      context: ./App
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - db

  maitre_sari:
    build:
      context: ./maitre_sari
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - db

  db:
    build:
      context: ./persistencia
      dockerfile: Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: